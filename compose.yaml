services:
  dira:
    build: .
    ports: ['127.0.0.1:8000:8000']
    environment:
      DIRA_MODE: simulation
      DIRA_QDRANT_URL: http://qdrant:6333
      DIRA_API_TOKEN: ${DIRA_API_TOKEN:-}
      DIRA_LLM_URL: ${DIRA_LLM_URL:-}
      DIRA_LLM_MODEL: ${DIRA_LLM_MODEL:-local}
    volumes:
      - evidence:/app/.data
    depends_on: [qdrant]
    restart: unless-stopped
    extra_hosts: ['host.docker.internal:host-gateway']
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ['127.0.0.1:6333:6333']
    volumes: ['qdrant:/qdrant/storage']
    restart: unless-stopped
  mediamtx:
    image: dira-mediamtx:local
    build:
      context: .
      dockerfile: infra/Dockerfile.mediamtx
    ports: ['127.0.0.1:8554:8554', '127.0.0.1:8888:8888', '127.0.0.1:8890:8890/udp', '127.0.0.1:9998:9998']
    volumes: ['./infra/mediamtx.offline.yml:/mediamtx.yml:ro', 'recordings:/recordings']
    restart: unless-stopped
  inference:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: [inference]
    ports: ['127.0.0.1:8080:8080']
    volumes: ['./models:/models:ro']
    command: ['-m', '/models/model.gguf', '--host', '0.0.0.0', '--port', '8080', '-c', '8192']
  asr:
    build:
      context: .
      dockerfile: infra/Dockerfile.asr
    profiles: [asr]
    ports: ['127.0.0.1:8001:8001']
    volumes: ['./models:/models:ro']
    environment:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DIRA_ASR_DEVICE: cpu
      DIRA_ASR_HOST: 0.0.0.0
      DIRA_ASR_MODEL_DIR: /models/qwen3-asr-0.6b
      DIRA_ASR_LANGUAGE: ar
      DIRA_ASR_AUDIO_BACKEND: windowed
    command: ['python', '/app/scripts/start_asr.py']
volumes:
  evidence:
  qdrant:
  recordings:
