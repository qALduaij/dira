[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dira"
version = "0.1.0"
description = "Sovereign real-time multimodal broadcast intelligence"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "numpy>=2,<3", "faiss-cpu>=1.10,<2", "qdrant-client>=1.15,<2", "regex>=2024.11", "websockets>=14,<16", "pyahocorasick>=2.2,<3"]

[project.optional-dependencies]
extraction = ["yt-dlp>=2025.10.22", "streamlink>=8.6.1,<9"]
perception = ["opencv-python-headless>=4.10,<5", "paddleocr==3.7.0", "paddlepaddle==3.3.1"]
semantic = ["sentence-transformers>=3,<6", "semantic-router>=0.1,<1"]
diarization = ["pyannote-audio>=4,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["backend/dira"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
